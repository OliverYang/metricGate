# metricgate policy — this repository dogfoods itself.
# `metricgate check .` must PASS this gate.
version: 1

gate:
  fail_on: error

exclude: [".git", "vendor", "node_modules", "testdata", ".data"]

languages:
  go:
    rules:
      banned-fmt-Print*:
        # The CLI is the one place where direct printing is the job.
        options:
          allowed_files: ["cmd/metricgate/"]
      todo-comment:
        enabled: false
        severity: info
    metrics:
      cyclomatic-complexity: { warn: 10, error: 15 }
      cognitive-complexity:  { warn: 15, error: 25 }
      function-length:       { warn: 50, error: 100 }
      file-length:           { warn: 400, error: 800 }
      nesting-depth:         { warn: 4,  error: 6 }
      params-count:          { warn: 5,  error: 8 }
      # fan-out (Yourdon & Constantine) and boolean-params (Fowler's flag
      # argument smell) also start in an observation period: warn at the
      # defaults, error turned off entirely (`error: off`) so nothing blocks
      # until the first findings pass review — then set a real error line.
      fan-out:               { warn: 10, error: off }
      boolean-params:        { warn: 2,  error: off }
      # npath-complexity (Nejmeh 1988, AT&T/checkstyle limit 200) starts in an
      # observation period: warn at the published 200 so findings are visible,
      # error off so nothing blocks until the first findings pass review —
      # then set a real error line (previously a magic 5000 above the repo max).
      npath-complexity:      { warn: 200, error: off }
    # each entry into the same deterministic rule pipeline (same findings, same
    # severities, same `metricgate: ignore` suppression).
    banned-api:
      - match: fmt.Print*
        reason: direct fmt.Print* writes to stdout, bypassing structured logging
        use: log via the project logger facade instead
      - match: panic
        reason: direct panic() aborts without letting callers decide
        use: return an error so callers can decide
        except_files: ["_test.go"]
      - kind: import
        match: os/exec
        reason: shelling out must stay in one auditable place (the git adapter)
        use: reuse internal/git's exec helpers, or inject a command-execution port interface
        except_files: ["internal/git/git.go", "internal/git/changes.go", "internal/hotspots/hotspots.go", "internal/gittest/gittest.go", "cmd/metricgate/main.go", "_test.go"]

  java:
    rules:
      print-stack-trace:
        severity: warning
      empty-block:
        severity: warning
      todo-comment:
        enabled: false
        severity: info
    metrics:
      cyclomatic-complexity: { warn: 10, error: 15 }
      cognitive-complexity:  { warn: 15, error: 25 }
      function-length:       { warn: 50, error: 100 }
      file-length:           { warn: 400, error: 800 }
      nesting-depth:         { warn: 4,  error: 6 }
      params-count:          { warn: 5,  error: 8 }
      # Same observation period as the Go section above (error: off).
      fan-out:               { warn: 10, error: off }
      boolean-params:        { warn: 2,  error: off }
      npath-complexity:      { warn: 200, error: off }
    banned-api:
      - match: System.out.print*
        reason: direct System.out.print* writes to the console, bypassing structured logging
        use: log via the project logger facade instead
      - match: System.err.print*
        reason: direct System.err.print* writes to the console, bypassing structured logging
        use: log via the project logger facade instead

# The design invariants of this project, enforced on every run instead of
# living in a README nobody re-reads: the checker core is a pure library with no
# process boundaries and no dependence on its output adapters, and the CLI is
# the only shell.
architecture:
  cycles: error
  # SDP stays advisory on purpose. Following our own "reuse the existing
  # implementation" guidance adds a dependency edge, and a new edge can make a
  # stable package depend on a less stable one — so a gate that fails on SDP
  # would punish exactly the behaviour we ask for. Warning + fail_on: error
  # means the finding is always visible and never blocking.
  sdp: warning
  # Instability is a ratio over integer coupling counts, so a gap below about
  # 1/(Ca+Ce) is quantization, not design debt. Our packages have Ca+Ce between
  # 2 and 18, i.e. a resolution of 0.06–0.14; the two noise-level violations
  # this repository used to report had gaps of 0.01 and 0.11.
  sdp_tolerance: 0.10
  layers:
    - name: cli
      packages: ["cmd/**"]
      may_depend_on: [core, adapter]
    - name: core
      packages:
        - internal/engine
        - internal/arch
        - internal/rules
        - internal/metrics
        - internal/parser
        - internal/config
        - internal/model
        - internal/selection
        - internal/diff
        - internal/regress
        - internal/refs
        - internal/impact
        - internal/repomap
        - internal/risk
        - internal/dist
        - internal/deps
        - internal/clones
        - internal/clonedrift
        - internal/digest
        - internal/extract
        - internal/feed
        - internal/gatecheck
        - internal/parsetest
        - internal/policygap
        - internal/rulegen
        - internal/status
        - internal/symbols
      may_depend_on: [core]
    - name: adapter
      packages:
        - internal/report
        - internal/store
        - internal/git
        - internal/facts
        - internal/stubs
        - internal/sources
        - internal/apisurface
        - internal/bundle
        - internal/calllog
        - internal/hotspots
        - internal/scorecard
      may_depend_on: [core, adapter]
    - name: tools
      packages: ["scripts/**"]
      may_depend_on: [core, adapter]
  forbid:
    - from: internal/**
      to: cmd/**
      reason: nothing may depend on the CLI shell

store:
  enabled: true
  path: ".metricgate/history.db"
