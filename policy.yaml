# metricgate policy — this repository dogfoods itself.
# `metricgate check .` must PASS this gate.
version: 1

gate:
  fail_on: error

exclude: [".git", "vendor", "node_modules", "testdata"]

languages:
  go:
    rules:
      banned-fmt-Print*:
        # The CLI is the one place where direct printing is the job.
        options:
          allowed_files: ["cmd/metricgate/main.go"]
      todo-comment:
        enabled: false
        severity: info
    metrics:
      cyclomatic-complexity: { warn: 10, error: 15 }
      cognitive-complexity:  { warn: 15, error: 25 }
      function-length:       { warn: 50, error: 100 }
      file-length:           { warn: 400, error: 800 }
      nesting-depth:         { warn: 4,  error: 6 }
      params-count:          { warn: 5,  error: 8 }
    # Organisational constraints live here, not in Go code: the engine compiles
    # each entry into the same deterministic rule pipeline (same findings, same
    # severities, same `metricgate: ignore` suppression).
    banned-api:
      - match: fmt.Print*
        reason: direct fmt.Print* writes to stdout; use the project logger
      - match: panic
        reason: direct panic(); return an error so callers can decide
        except_files: ["_test.go"]
      - kind: import
        match: os/exec
        reason: only the git adapter may shell out
        except_files: ["internal/diff/diff.go", "cmd/metricgate/main.go", "_test.go"]

  java:
    rules:
      print-stack-trace:
        severity: warning
      empty-block:
        severity: warning
      todo-comment:
        enabled: false
        severity: info
    metrics:
      cyclomatic-complexity: { warn: 10, error: 15 }
      cognitive-complexity:  { warn: 15, error: 25 }
      function-length:       { warn: 50, error: 100 }
      file-length:           { warn: 400, error: 800 }
      nesting-depth:         { warn: 4,  error: 6 }
      params-count:          { warn: 5,  error: 8 }
    banned-api:
      - match: System.out.print*
        reason: direct System.out.print* writes to the console; use the project logger
      - match: System.err.print*
        reason: direct System.err.print* writes to the console; use the project logger

store:
  enabled: false
  path: ".metricgate/history.db"
