# metricgate policy — this repository dogfoods itself.
# `metricgate check .` must PASS this gate.
version: 1

gate:
  fail_on: error

exclude: [".git", "vendor", "node_modules", "testdata"]

languages:
  go:
    rules:
      banned-fmt-Print*:
        # The CLI is the one place where direct printing is the job.
        options:
          allowed_files: ["cmd/metricgate/"]
      todo-comment:
        enabled: false
        severity: info
    metrics:
      cyclomatic-complexity: { warn: 10, error: 15 }
      cognitive-complexity:  { warn: 15, error: 25 }
      function-length:       { warn: 50, error: 100 }
      file-length:           { warn: 400, error: 800 }
      nesting-depth:         { warn: 4,  error: 6 }
      params-count:          { warn: 5,  error: 8 }
    # Organisational constraints live here, not in Go code: the engine compiles
    # each entry into the same deterministic rule pipeline (same findings, same
    # severities, same `metricgate: ignore` suppression).
    banned-api:
      - match: fmt.Print*
        reason: direct fmt.Print* writes to stdout; use the project logger
      - match: panic
        reason: direct panic(); return an error so callers can decide
        except_files: ["_test.go"]
      - kind: import
        match: os/exec
        reason: only the git adapter and the CLI may shell out
        except_files: ["internal/git/git.go", "cmd/metricgate/main.go", "_test.go"]

  java:
    rules:
      print-stack-trace:
        severity: warning
      empty-block:
        severity: warning
      todo-comment:
        enabled: false
        severity: info
    metrics:
      cyclomatic-complexity: { warn: 10, error: 15 }
      cognitive-complexity:  { warn: 15, error: 25 }
      function-length:       { warn: 50, error: 100 }
      file-length:           { warn: 400, error: 800 }
      nesting-depth:         { warn: 4,  error: 6 }
      params-count:          { warn: 5,  error: 8 }
    banned-api:
      - match: System.out.print*
        reason: direct System.out.print* writes to the console; use the project logger
      - match: System.err.print*
        reason: direct System.err.print* writes to the console; use the project logger

# The design invariants of this project, enforced on every run instead of
# living in a README nobody re-reads: the checker core is a pure library with no
# process boundaries and no dependence on its output adapters, and the CLI is
# the only shell.
architecture:
  cycles: error
  layers:
    - name: cli
      packages: ["cmd/**"]
      may_depend_on: [core, adapter]
    - name: core
      packages:
        - internal/engine
        - internal/arch
        - internal/rules
        - internal/metrics
        - internal/parser
        - internal/config
        - internal/model
        - internal/diff
      may_depend_on: [core]
    - name: adapter
      packages:
        - internal/report
        - internal/store
        - internal/git
        - internal/facts
        - internal/stubs
        - internal/sources
      may_depend_on: [core, adapter]
  forbid:
    - from: internal/**
      to: cmd/**
      reason: nothing may depend on the CLI shell

store:
  enabled: true
  path: ".metricgate/history.db"
