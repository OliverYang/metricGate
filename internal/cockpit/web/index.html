<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetricGate Audit Cockpit</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="brand">
      <button class="brand-home" data-action="scope.clear" title="回到项目总览">
        <span class="brand-mark">M</span><span class="brand-text"><strong>metricGate</strong><small>Audit cockpit</small></span>
      </button>
    </div>
    <header class="topbar">
      <nav class="breadcrumbs" id="shellCrumb" aria-label="当前位置" hidden></nav>
      <div class="topbar-heading">
        <p class="eyebrow">DETERMINISTIC AUDIT</p>
        <h1 id="pageTitle">项目总览</h1>
      </div>
      <div class="top-actions">
        <span class="updated" id="updatedAt">尚未同步</span>
        <button class="button" id="refreshBtn" data-action="refresh">↻ 刷新数据</button>
      </div>
    </header>
    <aside class="sidebar">
      <p class="nav-group">工作区</p>
      <nav aria-label="工作区" id="primaryNav">
        <button class="nav-item active" data-action="nav.view" data-view="projects"><span>◈</span>项目总览</button>
        <button class="nav-item" data-action="nav.view" data-view="overview"><span>⌂</span>项目概览</button>
        <button class="nav-item" data-action="nav.view" data-view="issues"><span>≡</span>问题分诊</button>
        <button class="nav-item" data-action="nav.view" data-view="gate"><span>⛨</span>质量门禁</button>
        <button class="nav-item" data-action="nav.view" data-view="calls"><span>▤</span>工具活动</button>
        <button class="nav-item" data-action="nav.view" data-view="runs"><span>◷</span>运行历史</button>
      </nav>
      <p class="nav-group">审计记录</p>
      <nav aria-label="审计记录">
        <button class="nav-item" data-action="nav.view" data-view="rules"><span>§</span>规则</button>
        <button class="nav-item" data-action="nav.view" data-view="activity"><span>◷</span>活动</button>
        <button class="nav-item" data-action="nav.view" data-view="policy"><span>✎</span>扫描配置</button>
      </nav>
      <div class="sidebar-foot"><span class="pulse"></span><span>本地数据源</span><small id="logPath">读取中…</small></div>
    </aside>
    <main class="main">
      <p class="page-subtitle" id="pageSubtitle">从本地调用记录识别仓库；无法验证归属的数据单独保留。</p>
      <div id="errorBanner" class="error-banner" role="alert" hidden></div>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden>
        <span id="toastText"></span>
        <button type="button" class="text-button" id="toastUndo" hidden>撤销</button>
      </div>
      <div id="viewStage"></div>
    </main>
  </div>
  <dialog id="detailDialog" aria-labelledby="detailTitle">
    <header class="dialog-head">
      <h2 id="detailTitle">详情</h2>
      <button class="icon-button" id="closeDialog" data-action="dialog.close" aria-label="关闭">×</button>
    </header>
    <div id="detailBody"></div>
  </dialog>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
