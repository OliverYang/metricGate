# Gate the lines a pull request adds.
#
# The scope is the diff, not the tree: this repository carries one accepted
# finding (see docs/claims.md), and a whole-tree gate would be red on every run
# for a reason no contributor can act on. A diff-scoped gate is green on the
# first run and can only ratchet — new violations fail, legacy debt does not.
#
# fetch-depth: 0 is required. The default shallow checkout has no merge-base
# with the target branch, and metricgate refuses to guess: it names the ref it
# could not resolve rather than reporting a clean tree.
name: metricgate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the gate
        run: go build -o metricgate ./cmd/metricgate

      - name: Check the changed lines
        run: |
          set -eu
          if [ -n "${{ github.base_ref }}" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          echo "gating against $base"
          ./metricgate check . -diff -base "$base"
