# The gate. One workflow for every change that reaches main:
#   pull_request -> gate the lines the PR adds, post the verdict as a check-run
#                   plus one sticky PR comment (this is the required check)
#   push to main -> gate the same lines on the way in, so a merge commit that
#                   bypassed review still gets a verdict in the Actions log
# Zero credentials: metricGate is pure local static analysis and calls nothing
# over the network.
#
# fetch-depth: 0 is required. The default shallow checkout has no merge-base
# with the target branch, and metricgate refuses to guess: it names the ref it
# could not resolve rather than reporting a clean tree.
#
# paths: keep in sync with internal/parser/parser.go LanguageForFile.
#
# WHY THE PULL_REQUEST TRIGGER HAS NO paths FILTER
#   A required check that never runs is not "skipped", it stays pending — and
#   a branch protected on it can never merge a change the filter excludes. The
#   first draft filtered paths on pull_request too, which meant a docs-only PR
#   waited forever for a gate that was never going to start. The diff-scoped
#   gate costs ~2s on this tree, so it runs on every PR and reports "no new
#   violations" when the diff touches no source file.
#
#   The push-to-main trigger keeps its filter: seal.yml already gates the whole
#   tree there, and a docs merge does not need a second full run.
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.go'
      - '**.java'
      - '**.ts'
      - '**.mts'
      - '**.cts'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.jsx'
      - '**.py'
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.cc'
      - '**.cxx'
      - '**.hpp'
      - '**.hh'
      - '**.hxx'
      - '**.cs'
      - '**.rs'
      - '.metricgate.yaml'
      - '.github/workflows/gate.yml'

permissions:
  # Check-run annotations (line-level findings on the PR diff).
  checks: write
  # The summary comment.
  pull-requests: write
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the gate
        run: go build -o metricgate ./cmd/metricgate

      - name: Resolve the base ref
        id: base
        run: |
          set -eu
          # A pull_request knows its target branch; a push to main knows the
          # commit it replaced. Both are resolved to something metricgate can
          # merge-base against, because a gate that cannot name its base is a
          # gate that reports a clean tree for the wrong reason.
          if [ -n "${{ github.base_ref }}" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            # A brand-new branch reports 40 zeros; there is no "before" to
            # diff against, so the first push gates its own commit only.
            case "$base" in
              *[!0]*) ;;
              *) base="HEAD~1" ;;
            esac
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "gating against $base"

      - name: Check the changed lines
        id: check
        run: |
          set -o pipefail
          base="${{ steps.base.outputs.base }}"
          # SARIF is written via -sarif; JSON goes to stdout, human output to
          # stderr. Exit code drives the required check: 0 pass, 1 violations.
          ./metricgate check . -diff -base "$base" \
            -sarif findings.sarif \
            -format json > findings.json
        continue-on-error: false

      - name: Summarize findings
        id: summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          path = "findings.json"
          body_path = "findings-summary.md"
          if not os.path.exists(path):
              open(body_path, "w").write("metricGate did not produce a findings report.\n")
              raise SystemExit(0)

          data = json.load(open(path))
          findings = data.get("findings", [])
          errors = [f for f in findings if f.get("severity") == "error"]
          warnings = [f for f in findings if f.get("severity") == "warning"]

          lines = ["## metricGate gate report", ""]
          verdict = "⛔ **gate FAILED**" if errors else ("⚠ **gate passed with warnings**" if warnings else "✅ **gate PASSED** — no new violations")
          lines.append(verdict + f" — {len(errors)} error(s), {len(warnings)} warning(s) on changed lines")
          lines.append("")
          shown = findings[:20]
          for f in shown:
              sev = "⛔" if f.get("severity") == "error" else "⚠"
              lines.append(f"- {sev} `{f.get('file','?')}:{f.get('startLine','?')}` **{f.get('ruleId','?')}** — {f.get('message','')}")
          if len(findings) > len(shown):
              lines.append(f"- … and {len(findings) - len(shown)} more (see the JSON artifact)")
          lines.append("")
          lines.append("<sub>metricGate is deterministic local static analysis: same diff, same verdict. No code leaves this runner.</sub>")
          open(body_path, "w").write("\n".join(lines) + "\n")
          PY

      - name: Comment on the PR
        # A push to main has no PR to comment on; the verdict lives in the log.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('findings-summary.md', 'utf8');
            const marker = '<!-- metricgate-gate-report -->';
            // Replace our previous comment instead of stacking one per run.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: marker + '\n' + body,
              });
            }

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricgate-findings
          path: |
            findings.json
            findings.sarif
