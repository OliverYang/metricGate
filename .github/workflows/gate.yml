# The gate. One workflow for every change that reaches main:
#   pull_request -> gate the lines the PR adds, post the verdict as a check-run
#                   plus one sticky PR comment (this is the required check)
#   push to main -> gate the same lines on the way in, so a merge commit that
#                   bypassed review still gets a verdict in the Actions log
# Zero credentials: metricGate is pure local static analysis and calls nothing
# over the network.
#
# fetch-depth: 0 is required. The default shallow checkout has no merge-base
# with the target branch, and metricgate refuses to guess: it names the ref it
# could not resolve rather than reporting a clean tree.
#
# WHY THE TRIGGER IS push AND NOT pull_request
#   GitHub will not start a workflow for a pull_request event that its own
#   GITHUB_TOKEN created: the run lands in `action_required` and waits for a
#   human to press "Approve workflows to run". autopr.yml opens the PR with
#   that token, so a pull_request-triggered gate would sit unapproved on every
#   PR this repository opens for itself, and the check would never report.
#   Verified 2026-10-17: the run had zero jobs and the commit had no `gate`
#   check at all (only autopr's own `open`).
#
#   A push carries the actor who pushed, so a run started by `git push` is not
#   bot-created and needs no approval. Checks are attached to the commit, not
#   to the PR, so gating the push puts the verdict on the PR's head SHA anyway.
#   The second push in that verification — same commit, actor OliverYang — ran
#   the gate to `success` with no approval step.
#
# WHY NO paths FILTER
#   A required check that never runs is not "skipped", it stays pending, and
#   whatever waits on it waits forever. The diff-scoped gate costs ~2s on this
#   tree, so it runs on every push and reports "no new violations" when the
#   diff touches no source file. The filter this replaces had a second failure
#   mode: it matched 21 suffixes by hand, so a language added to
#   internal/parser/parser.go silently gated nothing until someone remembered
#   to extend the list.
name: gate

on:
  push:
    branches: ['**']

permissions:
  # Check-run annotations (line-level findings on the PR diff).
  checks: write
  # The summary comment.
  pull-requests: write
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the gate
        run: go build -o metricgate ./cmd/metricgate

      - name: Resolve the base ref
        id: base
        run: |
          set -eu
          # A push to main knows the commit it replaced; a push to any other
          # branch is measured against main, which is where it intends to land.
          # Both are resolved to something metricgate can merge-base against,
          # because a gate that cannot name its base is a gate that reports a
          # clean tree for the wrong reason.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base="${{ github.event.before }}"
            # A brand-new branch reports 40 zeros; there is no "before" to
            # diff against, so the first push gates its own commit only.
            case "$base" in
              *[!0]*) ;;
              *) base="HEAD~1" ;;
            esac
          else
            base="origin/main"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "gating against $base"

      - name: Check the changed lines
        id: check
        run: |
          set -o pipefail
          base="${{ steps.base.outputs.base }}"
          # SARIF is written via -sarif; JSON goes to stdout, human output to
          # stderr. Exit code drives the required check: 0 pass, 1 violations.
          ./metricgate check . -diff -base "$base" \
            -sarif findings.sarif \
            -format json > findings.json
        continue-on-error: false

      - name: Summarize findings
        id: summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          path = "findings.json"
          body_path = "findings-summary.md"
          if not os.path.exists(path):
              open(body_path, "w").write("metricGate did not produce a findings report.\n")
              raise SystemExit(0)

          data = json.load(open(path))
          findings = data.get("findings", [])
          errors = [f for f in findings if f.get("severity") == "error"]
          warnings = [f for f in findings if f.get("severity") == "warning"]

          lines = ["## metricGate gate report", ""]
          verdict = "⛔ **gate FAILED**" if errors else ("⚠ **gate passed with warnings**" if warnings else "✅ **gate PASSED** — no new violations")
          lines.append(verdict + f" — {len(errors)} error(s), {len(warnings)} warning(s) on changed lines")
          lines.append("")
          shown = findings[:20]
          for f in shown:
              sev = "⛔" if f.get("severity") == "error" else "⚠"
              lines.append(f"- {sev} `{f.get('file','?')}:{f.get('startLine','?')}` **{f.get('ruleId','?')}** — {f.get('message','')}")
          if len(findings) > len(shown):
              lines.append(f"- … and {len(findings) - len(shown)} more (see the JSON artifact)")
          lines.append("")
          lines.append("<sub>metricGate is deterministic local static analysis: same diff, same verdict. No code leaves this runner.</sub>")
          open(body_path, "w").write("\n".join(lines) + "\n")
          PY

      - name: Find the pull request for this branch
        id: pr
        # A push to main has no PR to comment on; the verdict lives in the log.
        if: github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const find = async () => {
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, head: `${owner}:${branch}`, state: 'open',
              });
              return prs[0];
            };
            // The gate finishes in seconds; autopr.yml needs longer to open the
            // PR. Without this wait the first push of a branch reports no PR
            // and the comment only appears on the *second* push, which reads as
            // a gate that silently ignored the change.
            let pr = await find();
            for (let i = 0; i < 12 && !pr; i++) {
              await new Promise((r) => setTimeout(r, 5000));
              pr = await find();
            }
            const n = pr ? String(pr.number) : '';
            core.info(n ? `commenting on PR #${n}` : 'no open PR for this branch after 60s; the check-run still carries the verdict');
            core.setOutput('number', n);

      - name: Comment on the PR
        if: always() && steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('findings-summary.md', 'utf8');
            const marker = '<!-- metricgate-gate-report -->';
            const issue_number = Number('${{ steps.pr.outputs.number }}');
            // Replace our previous comment instead of stacking one per run.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: marker + '\n' + body,
              });
            }

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricgate-findings
          path: |
            findings.json
            findings.sarif
